name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.45.5
      - name: Deploy payment and admin functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-payment-order --project-ref hzzuqylaypoylakgnqxs
          supabase functions deploy verify-payment --project-ref hzzuqylaypoylakgnqxs
          supabase functions deploy razorpay-webhook --project-ref hzzuqylaypoylakgnqxs --no-verify-jwt
          supabase functions deploy admin-api --project-ref hzzuqylaypoylakgnqxs
