name: Storefront inventory regression guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: npm ci --prefix tests
      - name: Validate storefront, keyboard access, cart and sign-in
        run: node --test tests/storefront-consistency.test.cjs tests/storefront-quality.test.cjs tests/shopping-flow.test.cjs tests/email-otp.test.cjs
